<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Animated robot sticker: AI and machine learning"><title>Animated robot sticker: AI and machine learning</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0e0c"/><stop offset="1" stop-color="#14120f"/></linearGradient><filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#ede6d6}.eye{animation:bl 3.4s infinite;transform-box:fill-box;transform-origin:center}@keyframes bl{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.ant{animation:an 1s ease-in-out infinite alternate}@keyframes an{to{opacity:.25}}.hd{animation:tilt 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}@keyframes tilt{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="219" height="219" rx="18" fill="url(#bg)" stroke="#2a261f"/><g class="hd"><line x1="110" y1="38" x2="110" y2="58" stroke="#8f8676" stroke-width="4"/><circle class="ant" cx="110" cy="34" r="7" fill="#c9b48f"/><rect x="58" y="58" width="104" height="84" rx="22" fill="#17150f" stroke="#e2553b" stroke-width="3"/><ellipse class="eye" cx="88" cy="96" rx="10" ry="12" fill="#f2a03d"/><ellipse class="eye" cx="132" cy="96" rx="10" ry="12" fill="#f2a03d"/><path d="M92 122 Q110 134 128 122" stroke="#8fae7a" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="48" y="86" width="10" height="24" rx="4" fill="#e2553b"/><rect x="162" y="86" width="10" height="24" rx="4" fill="#e2553b"/></g><text x="110" y="180" text-anchor="middle" style="font:700 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#8f8676">training models</text></svg>