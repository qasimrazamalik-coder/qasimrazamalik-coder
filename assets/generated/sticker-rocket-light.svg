<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Animated rocket sticker: shipping"><title>Animated rocket sticker: shipping</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8faff"/><stop offset="1" stop-color="#eaf0ff"/></linearGradient><filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#0b1224}.rk{animation:fly 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fly{0%,100%{transform:translateY(6px)}50%{transform:translateY(-10px)}}.fl{animation:fl .14s steps(2) infinite;transform-box:fill-box;transform-origin:top center}@keyframes fl{50%{transform:scaleY(.6)}}.st{animation:st 1.2s linear infinite}@keyframes st{from{transform:translateY(-40px)}to{transform:translateY(240px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="219" height="219" rx="18" fill="url(#bg)" stroke="#d5ddf2"/><circle class="st" cx="25" cy="0" r="1" fill="#4b5675" style="animation-delay:-0.00s"/><circle class="st" cx="48" cy="47" r="2" fill="#4b5675" style="animation-delay:-0.17s"/><circle class="st" cx="71" cy="94" r="1" fill="#4b5675" style="animation-delay:-0.34s"/><circle class="st" cx="94" cy="141" r="2" fill="#4b5675" style="animation-delay:-0.51s"/><circle class="st" cx="117" cy="188" r="1" fill="#4b5675" style="animation-delay:-0.68s"/><circle class="st" cx="140" cy="15" r="2" fill="#4b5675" style="animation-delay:-0.85s"/><circle class="st" cx="163" cy="62" r="1" fill="#4b5675" style="animation-delay:-1.02s"/><circle class="st" cx="186" cy="109" r="2" fill="#4b5675" style="animation-delay:-1.19s"/><circle class="st" cx="39" cy="156" r="1" fill="#4b5675" style="animation-delay:-1.36s"/><circle class="st" cx="62" cy="203" r="2" fill="#4b5675" style="animation-delay:-1.53s"/><g class="rk"><path d="M110 40 C130 60 134 100 128 132 L92 132 C86 100 90 60 110 40Z" fill="#0b1224"/><circle cx="110" cy="84" r="11" fill="#0891b2" stroke="#f8faff" stroke-width="4"/><path d="M92 112 L72 140 L94 134Z" fill="#7c3aed"/><path d="M128 112 L148 140 L126 134Z" fill="#7c3aed"/><g class="fl"><path d="M96 132 L110 178 L124 132Z" fill="#fb923c"/><path d="M102 132 L110 160 L118 132Z" fill="#fde68a"/></g></g><text x="110" y="205" text-anchor="middle" style="font:700 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#4b5675">shipping</text></svg>