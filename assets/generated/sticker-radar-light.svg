<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Animated radar sticker: open to work"><title>Animated radar sticker: open to work</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f0e6"/><stop offset="1" stop-color="#efe8da"/></linearGradient><filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1c1a16}.sw{animation:rot 2.6s linear infinite;transform-origin:110px 100px}@keyframes rot{to{transform:rotate(360deg)}}.bl{animation:bp 2.6s ease-out infinite}@keyframes bp{0%,30%{opacity:0}35%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="219" height="219" rx="18" fill="url(#bg)" stroke="#ddd3c1"/><circle cx="110" cy="100" r="24" fill="none" stroke="#4d7a3f" stroke-opacity=".35"/><circle cx="110" cy="100" r="48" fill="none" stroke="#4d7a3f" stroke-opacity=".35"/><circle cx="110" cy="100" r="72" fill="none" stroke="#4d7a3f" stroke-opacity=".35"/><g class="sw"><path d="M110 100 L182 100 A72 72 0 0 0 161 49Z" fill="#4d7a3f" opacity=".35"/><line x1="110" y1="100" x2="182" y2="100" stroke="#4d7a3f" stroke-width="2"/></g><circle class="bl" cx="150" cy="62" r="6" fill="#4d7a3f"/><circle class="bl" cx="76" cy="130" r="5" fill="#4d7a3f" style="animation-delay:1.1s"/><text x="110" y="205" text-anchor="middle" style="font:700 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#4d7a3f">open to work</text></svg>