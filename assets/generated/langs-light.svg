<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 210" width="590" height="210" role="img" aria-label="Top languages by code size">
<title>Top languages by code size</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f0e6"/><stop offset="1" stop-color="#efe8da"/></linearGradient></defs>
<style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1c1a16}
.h{font:700 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
.m{font:500 12.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#6b6457}
.v{font:800 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
.in{animation:up .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grow{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:left}@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="589" height="209" rx="16" fill="url(#bg)" stroke="#ddd3c1"/>
<text class="h in" x="28" y="40">Languages I ship in</text><rect x="28.0" y="58" width="254.1" height="12" rx="3" fill="#3572A5" class="grow" style="animation-delay:0.20s"/><rect x="284.1" y="58" width="117.8" height="12" rx="3" fill="#3178c6" class="grow" style="animation-delay:0.32s"/><rect x="403.9" y="58" width="80.0" height="12" rx="3" fill="#f1e05a" class="grow" style="animation-delay:0.44s"/><rect x="486.0" y="58" width="44.9" height="12" rx="3" fill="#e34c26" class="grow" style="animation-delay:0.56s"/><rect x="532.9" y="58" width="13.6" height="12" rx="3" fill="#663399" class="grow" style="animation-delay:0.68s"/><rect x="548.5" y="58" width="11.5" height="12" rx="3" fill="#A97BFF" class="grow" style="animation-delay:0.80s"/><g class="in" style="animation-delay:0.40s"><circle cx="34" cy="99" r="6" fill="#3572A5"/><text x="48" y="104" style="font:600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif">Python</text><text class="m" x="278" y="104" text-anchor="end">48.0%</text></g><g class="in" style="animation-delay:0.48s"><circle cx="314" cy="99" r="6" fill="#3178c6"/><text x="328" y="104" style="font:600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif">TypeScript</text><text class="m" x="558" y="104" text-anchor="end">22.4%</text></g><g class="in" style="animation-delay:0.56s"><circle cx="34" cy="135" r="6" fill="#f1e05a"/><text x="48" y="140" style="font:600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif">JavaScript</text><text class="m" x="278" y="140" text-anchor="end">15.4%</text></g><g class="in" style="animation-delay:0.64s"><circle cx="314" cy="135" r="6" fill="#e34c26"/><text x="328" y="140" style="font:600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif">HTML</text><text class="m" x="558" y="140" text-anchor="end">8.8%</text></g><g class="in" style="animation-delay:0.72s"><circle cx="34" cy="171" r="6" fill="#663399"/><text x="48" y="176" style="font:600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif">CSS</text><text class="m" x="278" y="176" text-anchor="end">2.9%</text></g><g class="in" style="animation-delay:0.80s"><circle cx="314" cy="171" r="6" fill="#A97BFF"/><text x="328" y="176" style="font:600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif">Kotlin</text><text class="m" x="558" y="176" text-anchor="end">2.5%</text></g>
</svg>