<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Animated chai cup sticker: chai into code"><title>Animated chai cup sticker: chai into code</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f0e6"/><stop offset="1" stop-color="#efe8da"/></linearGradient><filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1c1a16}.sm{animation:sm 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes sm{0%{opacity:0;transform:translateY(10px) scaleY(.8)}40%{opacity:.9}100%{opacity:0;transform:translateY(-26px) scaleY(1.2)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x=".5" y=".5" width="219" height="219" rx="18" fill="url(#bg)" stroke="#ddd3c1"/><path class="sm" style="animation-delay:0.0s" d="M86 92 q-10 -14 0 -28 q10 -14 0 -28" stroke="#6b6457" stroke-width="4" fill="none" stroke-linecap="round"/><path class="sm" style="animation-delay:0.8s" d="M106 92 q-10 -14 0 -28 q10 -14 0 -28" stroke="#6b6457" stroke-width="4" fill="none" stroke-linecap="round"/><path class="sm" style="animation-delay:1.6s" d="M126 92 q-10 -14 0 -28 q10 -14 0 -28" stroke="#6b6457" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M62 100 H150 V140 Q150 172 106 172 Q62 172 62 140Z" fill="#8a6a3e"/><path d="M150 112 Q176 112 176 132 Q176 150 150 150" stroke="#8a6a3e" stroke-width="8" fill="none"/><rect x="62" y="100" width="88" height="10" fill="#fde68a" opacity=".8"/><text x="110" y="205" text-anchor="middle" style="font:700 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#6b6457">chai → code</text></svg>