<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Qasim Raza Malik: AI &amp; Backend Engineer · Full-Stack (React · TypeScript · Node.js) · Data Analyst</title>
<desc id="dsc">I build AI features, backend services and APIs, plus the React front ends and data work around them. Skills: Python, Node.js, LLMs &amp; RAG, REST APIs, PostgreSQL, React, SQL.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f0e6"/><stop offset="1" stop-color="#efe8da"/></linearGradient>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#b86a12"/><stop offset=".5" stop-color="#b33a22"/><stop offset="1" stop-color="#8a6a3e"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1c1a16" stroke-opacity="0.06"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="card"><rect width="1200" height="420" rx="22"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
.prompt{font:500 15px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#4d7a3f;animation:type1 1.6s .1s steps(32,end) both}
@keyframes type1{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% 0 -20% 0)}}
.name{font:700 60px 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;fill:#1c1a16;letter-spacing:-1px;animation:up .9s .35s cubic-bezier(.2,.8,.2,1) both}
.role{font:600 25px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#1c1a16}
.caret{font:600 25px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#b86a12;animation:blink 1s steps(1) infinite}
.tag{font:400 17.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#6b6457;animation:up .9s .8s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
.chipt{font:600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1c1a16}
.status{font:600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#4d7a3f}
.node{animation:pop .6s cubic-bezier(.2,1.3,.4,1) both;transform-box:fill-box;transform-origin:center}
.nt{font:700 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#1c1a16}
.ns{font:500 11.5px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#6b6457}
.wire{fill:none;stroke:#6b6457;stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
.wire-glow{fill:none;stroke-width:2;stroke-opacity:.0}
.spoke{fill:none;stroke:#6b6457;stroke-opacity:.18;stroke-width:1}
.blob{animation:drift 14s ease-in-out infinite alternate}
.ring{fill:none;stroke:#b33a22;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes dash{to{stroke-dashoffset:-11}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,30px)}}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.2);opacity:0}}
@keyframes type{0%{clip-path:inset(-20% 100% -20% 0);opacity:1;animation-timing-function:steps(22,end)}8.00%{clip-path:inset(-20% 0 -20% 0);opacity:1}20.00%{clip-path:inset(-20% 0 -20% 0);opacity:1;animation-timing-function:steps(14,end)}24.25%{clip-path:inset(-20% 100% -20% 0);opacity:1}25.00%,100%{clip-path:inset(-20% 100% -20% 0);opacity:0}}
.r0{animation:type 16s 0s infinite both}.r1{animation:type 16s 4s infinite both}.r2{animation:type 16s 8s infinite both}.r3{animation:type 16s 12s infinite both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.r0{clip-path:none;opacity:1}}
</style>
