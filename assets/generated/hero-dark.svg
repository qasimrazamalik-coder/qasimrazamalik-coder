<style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif}
.mono{font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace}
.prompt{font:500 15px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#34d399;animation:type1 1.6s .1s steps(32,end) both}
@keyframes type1{from{clip-path:inset(-20% 100% -20% 0)}to{clip-path:inset(-20% 0 -20% 0)}}
.name{font:800 58px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:url(#name);letter-spacing:-1px;animation:up .9s .35s cubic-bezier(.2,.8,.2,1) both}
.role{font:600 25px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#eef2ff}
.caret{font:600 25px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#22d3ee;animation:blink 1s steps(1) infinite}
.tag{font:400 17.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#8f9bbf;animation:up .9s .8s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
.chipt{font:600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#eef2ff}
.status{font:600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#34d399}
.node{animation:pop .6s cubic-bezier(.2,1.3,.4,1) both;transform-box:fill-box;transform-origin:center}
.nt{font:700 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#eef2ff}
.ns{font:500 11.5px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;fill:#8f9bbf}
.wire{fill:none;stroke:#8f9bbf;stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:5 6;animation:dash 1.2s linear infinite}
.wire-glow{fill:none;stroke-width:2;stroke-opacity:.0}
.spoke{fill:none;stroke:#8f9bbf;stroke-opacity:.18;stroke-width:1}
.blob{animation:drift 14s ease-in-out infinite alternate}
.ring{fill:none;stroke:#a78bfa;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes dash{to{stroke-dashoffset:-11}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,30px)}}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.2);opacity:0}}
@keyframes type{0%{clip-path:inset(-20% 100% -20% 0);opacity:1;animation-timing-function:steps(22,end)}6.40%{clip-path:inset(-20% 0 -20% 0);opacity:1}16.00%{clip-path:inset(-20% 0 -20% 0);opacity:1;animation-timing-function:steps(14,end)}19.40%{clip-path:inset(-20% 100% -20% 0);opacity:1}20.00%,100%{clip-path:inset(-20% 100% -20% 0);opacity:0}}
.r0{animation:type 20s 0s infinite both}.r1{animation:type 20s 4s infinite both}.r2{animation:type 20s 8s infinite both}.r3{animation:type 20s 12s infinite both}.r4{animation:type 20s 16s infinite both}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.r0{clip-path:none;opacity:1}}
</style>
